# Server configuration
server.port=8090

# -------------------------------------------------------
# H2 in-memory database (default, no installation needed)
# -------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:fleet_maintenance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------
# MySQL (uncomment and comment H2 above when using MySQL)
# -------------------------------------------------------
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fleet_maintenance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:password}

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT configuration
app.jwt.secret=${JWT_SECRET:mySecretKey12345678901234567890123456789012345678901234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.abc.fleet=INFO
logging.level.org.springframework.security=WARN