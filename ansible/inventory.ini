# ==============================================================================
# Fleet Maintenance Management System - Ansible Inventory
# ==============================================================================

# Local Target Node (Direct execution on the current host)
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Staging Environment Nodes
[staging]
fleet-stage-01.internal ansible_host=192.168.10.21 ansible_user=ubuntu

# Production Environment Nodes
[production]
fleet-prod-01.internal ansible_host=192.168.20.10 ansible_user=ubuntu
fleet-prod-02.internal ansible_host=192.168.20.11 ansible_user=ubuntu

# Group Aggregations
[fleet_servers:children]
local
staging
production

# Global Variables Across All Fleet Servers
[fleet_servers:vars]
ansible_python_interpreter=/usr/bin/python3
target_environment=production
app_name=fleet-maintenance-system